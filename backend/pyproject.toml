[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "core*", "db*", "workers*", "workflow*"]
exclude = ["tests*", "node_modules*", ".venv*"]

[project]
name = "startup-igniter-backend"
version = "0.1.0"
description = "Startup OS — FastAPI backend for the AI Startup Navigator"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Database / ORM
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",          # async PostgreSQL driver
    "psycopg2-binary>=2.9.9",   # sync driver (Alembic migrations)
    "pgvector>=0.3.6",          # Vector(384) column type for project_memory

    # Supabase
    "supabase>=2.5.0",

    # Redis / job queue
    "upstash-redis>=1.1.0",
    "arq>=0.26.0",              # async task queue (lighter than Celery)

    # Auth & security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",         # passlib 1.7.4 is incompatible with bcrypt>=4.1 (missing __about__, strict 72B limit)
    "python-multipart>=0.0.9",

    # HTTP client
    "httpx>=0.27.0",

    # Free web grounding (search + main-text extraction, no API keys)
    "ddgs>=9.0.0",
    "trafilatura>=2.0.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.1",

    # Document generation
    "docxtpl>=0.17.0",
    "python-pptx>=0.6.23",
    "weasyprint>=61.2",
    "Jinja2>=3.1.4",

    # Embeddings / retrieval (self-hosted, zero per-call cost)
    "sentence-transformers>=3.0.1",

    # Utilities
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-httpx>=0.30.0",
    "aiosqlite>=0.20.0",        # in-memory SQLite for tests/conftest.py
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
